<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valet</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="flame">◆</span>
      <span>Valet</span>
      <span id="model-name" class="model"></span>
    </div>
    <div class="header-actions">
      <span id="bridge-dot" class="dot" title="MCP bridge status"></span>
      <button id="config-btn" type="button" title="模型配置">⚙</button>
      <button id="clear-btn" type="button" title="New conversation">⟲</button>
    </div>
  </header>

  <section id="llm-config" class="llm-config hidden">
    <label for="cfg-base">接口地址</label>
    <input id="cfg-base" type="text" placeholder="https://openrouter.ai/api/v1" autocomplete="off" />
    <label for="cfg-key">API key</label>
    <input id="cfg-key" type="password" placeholder="只保存在这台浏览器" autocomplete="off" />
    <label for="cfg-model">模型名称</label>
    <input id="cfg-model" type="text" placeholder="会 tool calling 的模型" autocomplete="off" />
    <div class="llm-config-actions">
      <button id="cfg-save" type="button">确认</button>
      <span id="cfg-status"></span>
    </div>
  </section>

  <main id="messages">
    <div class="empty-state" id="empty-state">
      <p><strong>在这里发布任务。</strong></p>
      <p>模型自己拆解、看页、规划并操作，直到做完或页面卡住。不是一问一答。</p>
      <p class="hint">先执行 <code>npm start</code>，绿点表示插件已连接。</p>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="发布任务，例如：订一张武汉到北京的机票"></textarea>
      <div class="composer-actions">
        <button id="send-btn" title="发送">➤</button>
        <button id="stop-btn" class="hidden" type="button" title="终止当前任务">终止</button>
      </div>
    </div>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
