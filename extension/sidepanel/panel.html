<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valet</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="flame">◆</span>
      <span>Valet</span>
      <span id="model-name" class="model"></span>
    </div>
    <div class="header-actions">
      <span id="bridge-dot" class="dot" title="MCP bridge status"></span>
      <div class="header-buttons">
        <button id="config-btn" type="button" title="模型配置" aria-label="模型配置">⚙</button>
        <button id="clear-btn" type="button" title="新对话" aria-label="新对话" style="padding-top: 3px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 6.2A1.8 1.8 0 0 1 7.8 4.4h8.4A1.8 1.8 0 0 1 18 6.2v6.2a1.8 1.8 0 0 1-1.8 1.8H10l-4 3.2V6.2z"></path>
            <path d="M12 7.6v3.6M10.2 9.4h3.6"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <section id="llm-config" class="llm-config hidden">
    <label for="cfg-base">接口地址</label>
    <input id="cfg-base" type="text" placeholder="https://openrouter.ai/api/v1" autocomplete="off" />
    <label for="cfg-key">API key</label>
    <input id="cfg-key" type="password" placeholder="只保存在这台浏览器" autocomplete="off" />
    <label for="cfg-model">模型名称</label>
    <input id="cfg-model" type="text" placeholder="会 tool calling 的模型" autocomplete="off" />
    <div class="llm-config-actions">
      <button id="cfg-save" type="button">确认</button>
      <span id="cfg-status"></span>
    </div>
  </section>

  <main id="messages">
    <div class="empty-state" id="empty-state">
      <p><strong>在这里发布任务。</strong></p>
      <p>模型自己拆解、看页、规划并操作，直到做完为止。</p>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="发布任务，例如：订一张武汉到北京的机票"></textarea>
      <div class="composer-actions">
        <button id="send-btn" title="发送">➤</button>
        <button id="stop-btn" class="hidden" type="button" title="终止当前任务">终止</button>
      </div>
    </div>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
